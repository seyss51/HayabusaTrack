name: Build HayabusaTrack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: List wear source files (debug)
        run: find wear/src -type f | sort

      - name: List mobile source files (debug)
        run: find mobile/src -type f | sort

      - name: Generate Gradle Wrapper (8.7, compatible AGP 8.5.0)
        run: gradle wrapper --gradle-version 8.7 --distribution-type all

      - name: Build debug APKs
        run: ./gradlew :wear:assembleDebug :mobile:assembleDebug --no-daemon --stacktrace --info > build.log 2>&1 || (tail -c 20000 build.log && exit 1)

      - name: Rename APKs
        run: |
          mkdir -p out
          find wear/build/outputs/apk/debug -name "*.apk" -exec cp {} out/HayabusaTrack-Watch-debug.apk \;
          find mobile/build/outputs/apk/debug -name "*.apk" -exec cp {} out/HayabusaTrack-Phone-debug.apk \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: |
            out/HayabusaTrack-Watch-debug.apk
            out/HayabusaTrack-Phone-debug.apk